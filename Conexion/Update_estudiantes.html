<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actualizar Estudiante</title>
  <link rel="stylesheet" href="./CSS/formularioUpdate.css" />
</head>
<body>
  <h2>Actualizar Información del Estudiante</h2>
  <form action="Actualizar_Estudiantes.php" method="POST">
    <label for="Nombre">Nombre Nuevo:</label>
    <input type="text" id="Nombre" name="Nombre" required><br><br>

    <label for="Apellido">Apellido Nuevo:</label>
    <input type="text" id="Apellido" name="Apellido" required><br><br>

    <button type="submit">Actualizar</button>
  </form>
</body>

<div style="margin-top: 20px; text-align: center;">
  <button id="btnRegresar" style="
    background-color: #68b8d7;
    color: white;
    padding: 10px 20px;
    border-top: 30px;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;">
    Regresar
  </button>
</div>

<script>
  document.getElementById("btnRegresar").addEventListener("click", function () {
    window.history.back();
  });
</script>
</html>

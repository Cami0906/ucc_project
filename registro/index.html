<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro Estudiante</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="container" role="main">
    <h1>Registro Estudiante</h1>
    <form action="../Conexion/Create_EstudianteEmal.php" method="post" accept-charset="UTF-8">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" placeholder="Ingrese su nombre" required />

      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido" required />

      <label for="fechaNacimiento">Fecha de Nacimiento</label>
      <input type="date" id="fechaNacimiento" name="fechaNacimiento" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required />

      <!-- Corregido: mismo nombre e id -->
      <label for="contrasena">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" placeholder="Crea una contraseña segura" required minlength="6" />

      <button type="submit">Registrar</button>
    </form>

    <div id="resultado"></div>
  </div>
</body>
</html>
